name: Update Member Map Daily

on:
  schedule:
    - cron: '0 8 * * *'  # Runs every day at 8am UTC (3am Central)
  workflow_dispatch:      # Also lets you run it manually anytime

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          MIGHTY_API_TOKEN: ${{ secrets.MIGHTY_API_TOKEN }}
        run: python fetch_members.py

      - name: Save updated members.json
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add members.json
          git commit -m "Daily member map update" || echo "No changes"
          git push
